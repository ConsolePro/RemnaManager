resolver 127.0.0.11 valid=10s ipv6=off;
# Managed by RemnaManager Go
map $http_upgrade $rm_go_connection { default upgrade; '' close; }
gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_proxied any;
gzip_types application/javascript application/json application/wasm application/xml image/svg+xml text/css text/plain;
server {
 listen 80;
 server_name REPLACE_WITH_YOUR_DOMAIN;
 access_log off;
 location ^~ /.well-known/acme-challenge/ { root /var/www/remnamanager-acme; }
 location / { return 301 https://REPLACE_WITH_YOUR_DOMAIN$request_uri; }
}
server {
 listen 443 ssl;
 http2 on;
 server_name REPLACE_WITH_YOUR_DOMAIN;
 ssl_certificate /etc/nginx/ssl/fullchain.pem;
 ssl_certificate_key /etc/nginx/ssl/privkey.key;
 ssl_protocols TLSv1.2 TLSv1.3;
 server_tokens off;
 access_log off;
 add_header Referrer-Policy no-referrer always;
 location = /_rm_tinyauth {
  internal;
  proxy_pass http://tinyauth:3000/api/auth/nginx;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Authorization $http_x_api_key;
  proxy_set_header Host $host;
  proxy_set_header X-Original-URL https://$host$request_uri;
  proxy_set_header X-Original-Method $request_method;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host "";
  proxy_set_header X-Forwarded-Uri "";
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
 }
 location / {
  auth_request /_rm_tinyauth;
  auth_request_set $rm_go_auth_location $upstream_http_x_tinyauth_location;
  error_page 401 403 =302 $rm_go_auth_location;
  set $rm_go_upstream http://remnawave:3000;
  proxy_pass $rm_go_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port 443;
  proxy_set_header X-Forwarded-Prefix "";
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $rm_go_connection;
  proxy_set_header Remote-User "";
  proxy_set_header Remote-Email "";
  proxy_set_header Remote-Groups "";
  proxy_read_timeout 300s;
  proxy_set_header X-Api-Key "";
 }
}
