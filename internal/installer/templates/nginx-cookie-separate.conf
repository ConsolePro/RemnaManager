resolver 127.0.0.11 valid=10s ipv6=off;
# Managed by RemnaManager Go
map $http_upgrade $rm_go_connection { default upgrade; '' close; }
gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_proxied any;
gzip_types application/javascript application/json application/wasm application/xml image/svg+xml text/css text/plain;
map $cookie_COOKIE_NAME $rm_go_gate_cookie { default 0; ~^COOKIE_SECRET$ 1; }
map $arg_COOKIE_NAME $rm_go_gate_query { default 0; ~^COOKIE_SECRET$ 1; }
server {
 listen 80;
 server_name REPLACE_WITH_YOUR_DOMAIN;
 access_log off;
 location ^~ /.well-known/acme-challenge/ { root /var/www/remnamanager-acme; }
 location / { return 301 https://REPLACE_WITH_YOUR_DOMAIN$request_uri; }
}
server {
 listen 443 ssl;
 http2 on;
 server_name REPLACE_WITH_YOUR_DOMAIN;
 ssl_certificate /etc/nginx/ssl/fullchain.pem;
 ssl_certificate_key /etc/nginx/ssl/privkey.key;
 ssl_protocols TLSv1.2 TLSv1.3;
 server_tokens off;
 access_log off;
 add_header Referrer-Policy no-referrer always;
 location ~ ^/api/(subscriptions/|subscription-page-configs(/|$)|system/stats$) {
 if ($request_method != GET) { return 403; }
 if ($http_authorization != "Bearer SUBSCRIPTION_API_TOKEN") { return 403; }
  set $rm_go_upstream http://remnawave:3000;
  proxy_pass $rm_go_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port 443;
  proxy_set_header X-Forwarded-Prefix "";
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $rm_go_connection;
  proxy_set_header Remote-User "";
  proxy_set_header Remote-Email "";
  proxy_set_header Remote-Groups "";
  proxy_read_timeout 300s;
  proxy_set_header X-Api-Key "";
 }
 location = /auth/login {
  if ($rm_go_gate_query = 1) {
   add_header Set-Cookie "COOKIE_NAME=COOKIE_SECRET; Path=/; HttpOnly; Secure; SameSite=Strict; Max-Age=604800" always;
   add_header Referrer-Policy no-referrer always;
   add_header Cache-Control no-store always;
   return 303 /auth/login;
  }
  if ($rm_go_gate_cookie = 0) { return 403; }
  set $rm_go_upstream http://remnawave:3000;
  proxy_pass $rm_go_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port 443;
  proxy_set_header X-Forwarded-Prefix "";
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $rm_go_connection;
  proxy_set_header Remote-User "";
  proxy_set_header Remote-Email "";
  proxy_set_header Remote-Groups "";
  proxy_read_timeout 300s;
  proxy_set_header X-Api-Key "";
 }
 location / {
  if ($rm_go_gate_cookie = 0) { return 403; }
  set $rm_go_upstream http://remnawave:3000;
  proxy_pass $rm_go_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port 443;
  proxy_set_header X-Forwarded-Prefix "";
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $rm_go_connection;
  proxy_set_header Remote-User "";
  proxy_set_header Remote-Email "";
  proxy_set_header Remote-Groups "";
  proxy_read_timeout 300s;
  proxy_set_header X-Api-Key "";
 }
}
server { listen 443 ssl default_server; server_name _; ssl_reject_handshake on; }
