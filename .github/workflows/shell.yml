name: Go TUI and legacy checks
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...
      - run: go vet ./...
      - name: Validate client schemes with official Xray
        run: python3 tests/xray-template-fixture.py
      - run: bash -n install.sh
      - name: Verify remote update transactions
        run: |
          sudo apt-get update && sudo apt-get install -y jq shellcheck
          shellcheck --shell=bash internal/installer/node_agent.sh internal/installer/node_update_agent.sh internal/installer/node_site_agent.sh internal/installer/node_layout_agent.sh internal/installer/node_core_agent.sh internal/installer/node_warp_agent.sh
          python3 tests/node-files-fixture.py
          python3 tests/node-core-fixture.py --jq /usr/bin/jq
          python3 tests/node-warp-fixture.py
          python3 tests/warp-process-fixture.py
          mkdir -p .test-state
          go build -ldflags "-X github.com/ConsolePro/RemnaManager/internal/updater.Version=v$(cat VERSION)" -o .test-state/installer-fixture-manager ./cmd/remna
          python3 tests/binary-install-fixture.py --binary .test-state/installer-fixture-manager --jq /usr/bin/jq
  go-installer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ['debian:12', 'debian:13', 'ubuntu:22.04', 'ubuntu:24.04']
    steps:
      - uses: actions/checkout@v4
      - name: Install twice and check real terminal
        run: >-
          docker run --rm -e RM_CONTAINER_TESTS=1 -v "$PWD:/source:ro"
          '${{ matrix.image }}' bash -c
          'apt-get update && apt-get install -y python3 && bash /source/tests/go-installer.sh'
  warp-routing-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify WARP policy routing in an isolated kernel namespace
        run: >-
          docker run --rm --cap-add NET_ADMIN -e RM_CONTAINER_TESTS=1
          -v "$PWD/tests/warp-routing-kernel.sh:/test.sh:ro"
          -v "$PWD/internal/installer/node_warp_agent.sh:/agent.sh:ro"
          debian:13 bash -c
          'apt-get update && apt-get install -y iproute2 && bash /test.sh /agent.sh'
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: legacy/bash
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Syntax and dependencies
        run: bash manager.sh --check
      - name: ShellCheck
        run: shellcheck -x install.sh remnamanager.sh manager.sh agent.sh build.sh lib/*.sh tests/*.sh
      - name: Regression tests and distribution
        run: bash tests/run.sh
  linux-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ['debian:12', 'debian:13', 'ubuntu:22.04', 'ubuntu:24.04']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: legacy/bash
      - name: Test supported Linux distribution
        run: docker run --rm -e RM_CONTAINER_TESTS=1 -v "$PWD:/source:ro" '${{ matrix.image }}' bash /source/tests/container.sh
